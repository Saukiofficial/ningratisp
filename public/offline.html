<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .floating-shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 20s infinite ease-in-out;
        }

        .shape1 {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .shape2 {
            width: 200px;
            height: 200px;
            bottom: -50px;
            right: -50px;
            animation-delay: 2s;
        }

        .shape3 {
            width: 150px;
            height: 150px;
            top: 50%;
            right: 10%;
            animation-delay: 4s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }

            33% {
                transform: translate(30px, -30px) rotate(120deg);
            }

            66% {
                transform: translate(-20px, 20px) rotate(240deg);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px;
            max-width: 600px;
            width: 90%;
        }

        .icon-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            position: relative;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .wifi-icon {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .wifi-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        .wifi-circle:nth-child(1) {
            width: 40px;
            height: 40px;
            animation-delay: 0s;
        }

        .wifi-circle:nth-child(2) {
            width: 70px;
            height: 70px;
            animation-delay: 0.3s;
        }

        .wifi-circle:nth-child(3) {
            width: 100px;
            height: 100px;
            animation-delay: 0.6s;
        }

        .wifi-slash {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 4px;
            background: #fff;
            transform: translate(-50%, -50%) rotate(-45deg);
            border-radius: 2px;
        }

        @keyframes ping {

            75%,
            100% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0;
            }
        }

        h1 {
            color: #fff;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            animation: fadeInUp 0.6s ease-out;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.6;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        .info-cards {
            display: grid;
            gap: 15px;
            margin: 40px 0;
            animation: fadeInUp 0.6s ease-out 0.4s both;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            text-align: left;
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
        }

        .info-card h3 {
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-card p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .icon {
            width: 24px;
            height: 24px;
            display: inline-block;
        }

        .btn-retry {
            background: #fff;
            color: #667eea;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeInUp 0.6s ease-out 0.6s both;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .btn-retry:active {
            transform: translateY(0);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #ff4757;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .icon-container {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>

<body>
    <div class="bg-animation">
        <div class="floating-shape shape1"></div>
        <div class="floating-shape shape2"></div>
        <div class="floating-shape shape3"></div>
    </div>

    <div class="container">
        <div class="icon-container">
            <div class="wifi-icon">
                <div class="wifi-circle"></div>
                <div class="wifi-circle"></div>
                <div class="wifi-circle"></div>
                <div class="wifi-slash"></div>
            </div>
        </div>

        <h1>
            <span class="status-indicator"></span>You're Offline
        </h1>
        <p class="subtitle">
            Oops! It looks like you've lost your internet connection. Don't worry, we'll get you back online.
        </p>

        <div class="info-cards">
            <div class="info-card">
                <h3>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                        <path d="M2 17l10 5 10-5"></path>
                        <path d="M2 12l10 5 10-5"></path>
                    </svg>
                    Check Your Connection
                </h3>
                <p>Make sure WiFi or mobile data is turned on and airplane mode is off.</p>
            </div>

            <div class="info-card">
                <h3>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2">
                        </path>
                    </svg>
                    Automatic Retry
                </h3>
                <p>This page will automatically refresh when your connection is restored.</p>
            </div>
        </div>

        <button class="btn-retry" onclick="location.reload()">
            Try Again Now
        </button>
    </div>

    <script>
        window.addEventListener('online', function () {
            document.querySelector('h1').innerHTML = '<span class="status-indicator" style="background: #2ed573;"></span>Back Online!';
            document.querySelector('.subtitle').textContent = 'Great! Your connection has been restored. Refreshing...';
            setTimeout(function () {
                location.reload();
            }, 1000);
        });

        // setInterval(function () {
        //     if (navigator.onLine) {
        //         location.reload();
        //     }
        // }, 5000);
    </script>
</body>

</html>
